          description: Business system the data originates from
          maxLength: 80
          type: string
        externalId:
          description: Your own id for the document. Returned as externalId in query
            results and chat citations.
          maxLength: 500
          minLength: 1
          type: string
        metadata:
          description: "JSON object of your own key-value pairs for the document,\
            \ for example {\"region\":\"EU\",\"priority\":2}. Values are strings,\
            \ numbers or booleans; at most 50 keys and 8192 bytes. Returned as metadata\
            \ in query results and chat citations."
