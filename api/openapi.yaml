  securitySchemes:
    bearerAuth:
      description: "A personal key from Developers → API keys or an organization key\
        \ from Security → API keys. Personal keys start with ygg_. Organization keys\
        \ start with ygg_org_. A new personal key can read documents and the graph\
        \ (documents:read, graph:read); choose more scopes when you create it. Send\
        \ it as Authorization: Bearer <key>."
      scheme: bearer
      type: http
    apiKeyAuth:
      description: "A personal key from Developers → API keys or an organization key\
        \ from Security → API keys. Personal keys start with ygg_. Organization keys\
        \ start with ygg_org_. A new personal key can read documents and the graph\
        \ (documents:read, graph:read); choose more scopes when you create it. Send\
        \ it in the x-api-key header."
      in: header
      name: x-api-key
      type: apiKey
    writeBackSignature:
      description: "`t=<unix seconds>,v1=<hex HMAC-SHA256 of <t>.<raw body>>`, signed\
        \ with the signing secret of the write-back endpoint that received the write\
        \ order. Only the write-back result callback takes it, and it takes nothing\
        \ else."
      in: header
      name: yggy-signature
      type: apiKey
