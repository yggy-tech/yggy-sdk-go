openapi: 3.1.0
info:
  contact:
    email: support@yggy.tech
    name: yggy support
    url: https://yggy.tech/support
  description: HTTP API for yggy. Send an API key on each request. Send one key; a
    different credential in a second header is refused with 400.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://yggy.tech/terms
  title: yggy API
  version: v1
externalDocs:
  description: yggy documentation
  url: https://docs.yggy.tech/developers/
servers:
- description: Production
  url: https://api.yggy.tech
- description: Development
  url: https://api.dev.yggy.tech
security:
- bearerAuth: []
- apiKeyAuth: []
tags:
- name: projects
- name: documents
- name: query
- name: chat
- name: graph
- name: ontology
- name: graph-exports
paths:
  /api/v1/projects:
    get:
      description: "List projects in the active organization with pagination, search,\
        \ and sort. Organization owners and admins and organization API keys see every\
        \ shared project. Other members see the projects they are a member of, plus\
        \ public projects, which come back with isMember false and no counts. Private\
        \ projects they are not a member of are not listed and not counted in total.\
        \ Default sort is recentlyViewed (last-viewed desc, falling back to createdAt\
        \ desc), so a user with no views yet gets creation-time order. name orders\
        \ by project name. Search is a case-insensitive substring over project name\
        \ and slug."
      operationId: listProjects
      parameters:
      - description: "Page size, from 1 to 100."
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 20
          description: "Page size, from 1 to 100."
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - description: Zero-based offset for pagination.
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          description: Zero-based offset for pagination.
          minimum: 0
          nullable: true
          type: integer
        style: form
      - description: Case-insensitive substring search over project name and slug.
          Omit or leave blank to list every project.
        explode: true
        in: query
        name: q
        required: false
        schema:
          description: Case-insensitive substring search over project name and slug.
            Omit or leave blank to list every project.
          maxLength: 200
          type: string
        style: form
      - description: "recentlyViewed orders by the caller's last-viewed timestamp\
          \ (falls back to createdAt desc when no views exist), createdAt orders by\
          \ creation time, name orders by project name (case-insensitive)."
        explode: true
        in: query
        name: sortBy
        required: false
        schema:
          default: recentlyViewed
          description: "recentlyViewed orders by the caller's last-viewed timestamp\
            \ (falls back to createdAt desc when no views exist), createdAt orders\
            \ by creation time, name orders by project name (case-insensitive)."
          enum:
          - createdAt
          - recentlyViewed
          - name
          type: string
        style: form
      - explode: true
        in: query
        name: sortDir
        required: false
        schema:
          default: desc
          enum:
          - asc
          - desc
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listProjects_200_response"
          description: Projects retrieved successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listProjects_400_response"
          description: Bad request - no active organization
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listProjects_400_response"
          description: Unauthorized - no active session
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listProjects_400_response"
          description: Internal server error
      summary: List organization projects
      tags:
      - projects
    post:
      description: Create a new project within the active organization. Projects organize
        workloads and isolate tokens and integrations.
      operationId: createProject
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/createProject_request"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createProject_201_response"
          description: Project created successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listProjects_400_response"
          description: Invalid request body
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listProjects_400_response"
          description: Unauthorized - no active session
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listProjects_400_response"
          description: Forbidden - insufficient permissions
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listProjects_400_response"
          description: Conflict - project slug already exists
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listProjects_400_response"
          description: Internal server error
      summary: Create a new project
      tags:
      - projects
  /api/v1/projects/{projectId}/documents:
    get:
      description: "Retrieve a list of documents scoped to the project, with optional\
        \ filtering and pagination."
      operationId: listDocuments
      parameters:
      - explode: false
        in: path
        name: projectId
        required: true
        schema:
          minLength: 1
          type: string
        style: simple
      - description: "Filter documents by project ID. When omitted, returns all of\
          \ the organization's documents."
        explode: true
        in: query
        name: projectId
        required: false
        schema:
          description: "Filter documents by project ID. When omitted, returns all\
            \ of the organization's documents."
          type: string
        style: form
      - explode: true
        in: query
        name: status
        required: false
        schema:
          enum:
          - pending
          - processing
          - completed
          - failed
          - stored
          type: string
        style: form
      - description: "Filter by archive state: false (default) excludes archived,\
          \ true includes all, only shows archived only"
        explode: true
        in: query
        name: archived
        required: false
        schema:
          default: "false"
          description: "Filter by archive state: false (default) excludes archived,\
            \ true includes all, only shows archived only"
          enum:
          - "true"
          - "false"
          - only
          type: string
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 20
          maximum: 500
          minimum: 1
          type: number
        style: form
      - explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          nullable: true
          type: number
        style: form
      - explode: true
        in: query
        name: sortBy
        required: false
        schema:
          default: createdAt
          enum:
          - title
          - createdAt
          - updatedAt
          type: string
        style: form
      - explode: true
        in: query
        name: sortDir
        required: false
        schema:
          default: desc
          enum:
          - asc
          - desc
          type: string
        style: form
      - description: Case-insensitive substring search over title and source filename/path.
        explode: true
        in: query
        name: q
        required: false
        schema:
          description: Case-insensitive substring search over title and source filename/path.
          maxLength: 200
          minLength: 1
          type: string
        style: form
      - description: Browse documents in this folder (externalId). Use the literal
          value `root` for unfiled documents only. Omit to list all documents (legacy).
        explode: true
        in: query
        name: folderId
        required: false
        schema:
          description: Browse documents in this folder (externalId). Use the literal
            value `root` for unfiled documents only. Omit to list all documents (legacy).
          minLength: 1
          type: string
        style: form
      - description: "When set, only documents of this note kind (capture, daily,\
          \ or note)."
        explode: true
        in: query
        name: noteKind
        required: false
        schema:
          description: "When set, only documents of this note kind (capture, daily,\
            \ or note)."
          enum:
          - capture
          - daily
          - note
          type: string
        style: form
      - explode: false
        in: header
        name: x-yggy-organization-id
        required: false
        schema:
          nullable: true
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listDocuments_200_response"
          description: List of documents
      summary: List documents for a project
      tags:
      - documents
  /api/v1/projects/{projectId}/documents/upload:
    post:
      description: "Uploads a document to storage, binds it to the project from the\
        \ path, and queues it for processing."
      operationId: uploadDocument
      parameters:
      - explode: false
        in: path
        name: projectId
        required: true
        schema:
          minLength: 1
          type: string
        style: simple
      - explode: false
        in: header
        name: x-yggy-organization-id
        required: false
        schema:
          nullable: true
          type: string
        style: simple
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/uploadDocument_request"
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/uploadDocument_202_response"
          description: Document queued for processing
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/uploadDocument_400_response"
          description: Invalid request
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/uploadDocument_400_response"
          description: Failed to queue document
      summary: Upload and queue a document for async processing (project-scoped)
      tags:
      - documents
  /api/v1/projects/{projectId}/documents/{id}:
    delete:
      description: "Soft-delete a document by its ID, scoped to the project."
      operationId: deleteDocument
      parameters:
      - explode: false
        in: path
        name: projectId
        required: true
        schema:
          minLength: 1
          type: string
        style: simple
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: header
        name: x-yggy-organization-id
        required: false
        schema:
          nullable: true
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/deleteDocument_200_response"
          description: Document deleted
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listProjects_400_response"
          description: Document not found
      summary: Delete a document and its extracted triples (project-scoped)
      tags:
      - documents
    get:
      description: "Retrieve the details of a specific document by its ID, scoped\
        \ to the project."
      operationId: getDocument
      parameters:
      - explode: false
        in: path
        name: projectId
        required: true
        schema:
          minLength: 1
          type: string
        style: simple
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: header
        name: x-yggy-organization-id
        required: false
        schema:
          nullable: true
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listDocuments_200_response_documents_inner"
          description: Document details
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listProjects_400_response"
          description: Document not found
      summary: Get a document by ID (project-scoped)
      tags:
      - documents
  /api/v1/projects/{projectId}/documents/{id}/status:
    get:
      description: "Get the current processing status of a document, including progress\
        \ and any errors."
      operationId: getDocumentStatus
      parameters:
      - explode: false
        in: path
        name: projectId
        required: true
        schema:
          minLength: 1
          type: string
        style: simple
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: header
        name: x-yggy-organization-id
        required: false
        schema:
          nullable: true
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getDocumentStatus_200_response"
          description: Document processing status
      summary: Get document processing status (project-scoped)
      tags:
      - documents
  /api/v1/projects/{projectId}/documents/{id}/status/stream:
    get:
      description: Subscribe to real-time document processing status updates via Server-Sent
        Events (SSE).
      operationId: streamDocumentStatus
      parameters:
      - explode: false
        in: path
        name: projectId
        required: true
        schema:
          minLength: 1
          type: string
        style: simple
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
          description: SSE stream of status updates
      summary: Stream document processing status (project-scoped)
      tags:
      - documents
  /api/v1/projects/{projectId}/documents/{id}/triples:
    get:
      description: Retrieve all triples that have been extracted from the specified
        document.
      operationId: listDocumentTriples
      parameters:
      - explode: false
        in: path
        name: projectId
        required: true
        schema:
          minLength: 1
          type: string
        style: simple
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: header
        name: x-yggy-organization-id
        required: false
        schema:
          nullable: true
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listDocumentTriples_200_response"
          description: Extracted triples
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listProjects_400_response"
          description: Document not found
      summary: Get triples extracted from a document (project-scoped)
      tags:
      - documents
  /api/v1/projects/{projectId}/documents/{id}/download:
    get:
      description: "Download the original file that was uploaded, scoped to the project."
      operationId: downloadDocument
      parameters:
      - explode: false
        in: path
        name: projectId
        required: true
        schema:
          minLength: 1
          type: string
        style: simple
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: header
        name: x-yggy-organization-id
        required: false
        schema:
          nullable: true
          type: string
        style: simple
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                default: ""
                type: string
          description: File content
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listProjects_400_response"
          description: Document or file not found
      summary: Download original document (project-scoped)
      tags:
      - documents
  /api/v1/projects/{projectId}/documents/{id}/retry:
    post:
      description: "Re-trigger processing for a document. Purges the old invocation,\
        \ resets the document status to PENDING, and re-triggers the workflow using\
        \ the already-stored file."
      operationId: retryDocument
      parameters:
      - explode: false
        in: path
        name: projectId
        required: true
        schema:
          minLength: 1
          type: string
        style: simple
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: header
        name: x-yggy-organization-id
        required: false
        schema:
          nullable: true
          type: string
        style: simple
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/retryDocument_202_response"
          description: Document requeued for processing
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/uploadDocument_400_response"
          description: No stored file available for retry
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/uploadDocument_400_response"
          description: Document not found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/uploadDocument_400_response"
          description: Document is already being processed
      summary: Retry document processing (project-scoped)
      tags:
      - documents
  /api/v1/projects/{projectId}/documents/{id}/re-extract:
    post:
      description: Delete existing triples and re-trigger extraction. Structured documents
        reuse a stored mapping when it still validates against the current ontology
        and identity contract; otherwise a new mapping is generated. Unstructured
        documents re-run the full extraction pipeline.
      operationId: reExtractDocument
      parameters:
      - explode: false
        in: path
        name: projectId
        required: true
        schema:
          minLength: 1
          type: string
        style: simple
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: header
        name: x-yggy-organization-id
        required: false
        schema:
          nullable: true
          type: string
        style: simple
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/retryDocument_202_response"
          description: Re-extraction started
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listProjects_400_response"
          description: Document cannot be re-extracted
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listProjects_400_response"
          description: Document not found
      summary: Re-extract triples from a document (project-scoped)
      tags:
      - documents
  /api/v1/projects/{projectId}/query:
    post:
      description: "Returns the documents in this project that best answer the question,\
        \ best first, each with the passage that matches and a relevance score. yggy\
        \ finds them through the facts it extracted (a fact found by the question\
        \ leads to the document it came from) and through the document title and text.\
        \ Add `include` to attach the facts of the returned documents, or the entities\
        \ they mention. This route retrieves only; for a written answer use chat."
      operationId: queryProject
      parameters:
      - explode: false
        in: path
        name: projectId
        required: true
        schema:
          minLength: 1
          type: string
        style: simple
      - explode: false
        in: header
        name: x-yggy-organization-id
        required: false
        schema:
          nullable: true
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/queryProject_request"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/queryProject_200_response"
          description: Ranked contexts and an extractive answer
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listProjects_400_response"
          description: Invalid request or usage limit exceeded
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listProjects_400_response"
          description: Authentication required
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listProjects_400_response"
          description: Project access denied
      security:
      - bearerAuth: []
      summary: Find the documents that answer a question in a project
      tags:
      - query
  /api/v1/query:
    post:
      description: "Same as the project query, across every project the caller can\
        \ access. Results from all those projects are ranked together."
      operationId: queryOrganization
      parameters:
      - explode: false
        in: header
        name: x-yggy-organization-id
        required: false
        schema:
          nullable: true
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/queryProject_request"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/queryProject_200_response"
          description: Ranked contexts and an extractive answer
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listProjects_400_response"
          description: Invalid request or usage limit exceeded
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listProjects_400_response"
          description: Authentication required
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listProjects_400_response"
          description: Project access denied
      security:
      - bearerAuth: []
      summary: Find the documents that answer a question across the organization
      tags:
      - query
  /api/v1/projects/{projectId}/chat:
    post:
      description: |-
        Ask questions about your documents using the knowledge graph.

        The AI agent will search the graph, find relevant entities and relationships, and synthesize an answer.

        Examples of questions you can ask:
        - "Who founded Acme Corp?"
        - "What topics are discussed in my documents?"
        - "How is John Smith related to the AI project?"
        - "What are the main entities mentioned?"
      operationId: chat
      parameters:
      - explode: false
        in: path
        name: projectId
        required: true
        schema:
          minLength: 1
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/chat_request"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/chat_200_response"
          description: Chat response
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/chat_401_response"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/chat_401_response"
          description: Project access denied
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/chat_401_response"
          description: Internal server error
        "504":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/chat_401_response"
          description: The answer took longer than the chat budget; try again
      security:
      - bearerAuth: []
      summary: Chat with Knowledge Graph
      tags:
      - chat
  /api/v1/projects/{projectId}/graph/entities/by-identity:
    get:
      operationId: getEntityByIdentity
      parameters:
      - explode: false
        in: path
        name: projectId
        required: true
        schema:
          minLength: 1
          type: string
        style: simple
      - description: Stable identity URI of the organization entity
        explode: true
        in: query
        name: uri
        required: true
        schema:
          description: Stable identity URI of the organization entity
          format: uri
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityRead"
          description: Entity read
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listProjects_400_response"
          description: Entity not found
      summary: Read an organization entity and this project's facts about it
      tags:
      - graph
  /api/v1/projects/{projectId}/ontology/overview:
    get:
      description: Returns ontology versions and totals for one project. List endpoints
        page the vocabulary.
      operationId: getOntologyOverview
      parameters:
      - explode: false
        in: path
        name: projectId
        required: true
        schema:
          minLength: 1
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getOntologyOverview_200_response"
          description: Ontology summary
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getOntologyOverview_401_response"
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getOntologyOverview_401_response"
          description: Internal server error
      summary: Project ontology summary
      tags:
      - ontology
